<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Admin - Koarmada</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        header {
            background: #0b1f33;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .box {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #0b1f33;
            color: white;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Dashboard Admin</h1>
    <p>Portal Pendaftaran Koarmada</p>
</header>

<div class="container">

   <div class="box">
    <h2>Unit Staff</h2>

    <p>Status: <strong id="statusStaff">DIBUKA</strong></p>

    <button type="button" id="tombolStaff">
        TUTUP PENDAFTARAN
    </button>
</div>
        
<div class="box">
    <h2>SRT</h2>

    <p>Status: <strong id="statusSRT">DIBUKA</strong></p>

    <button type="button" id="tombolSRT">
        TUTUP PENDAFTARAN
    </button>
</div>
    

<div class="box">
    <h2>Provost</h2>

    <p>Status: <strong id="statusProvost">DIBUKA</strong></p>

    <button type="button" id="tombolProvost">
        TUTUP PENDAFTARAN
    </button>
</div>

<div class="box">
    <h2>Sekad</h2>

    <p>Status: <strong id="statusSekad">DIBUKA</strong></p>

    <button type="button" id="tombolSekad">
        TUTUP PENDAFTARAN
    </button>
</div>

    
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
    getFirestore,
    collection,
    addDoc,
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCIh890N6ZB_dxLipV8dODWS7YVitYWVew",
    authDomain: "portal-koarmada.firebaseapp.com",
    projectId: "portal-koarmada",
    storageBucket: "portal-koarmada.firebasestorage.app",
    messagingSenderId: "370381398452",
    appId: "1:370381398452:web:4fc785f94de5e9e101d2e1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


// ============================
// TAMBAH PESERTA
// ============================

window.tambahPeserta = async function() {

    const nama = document.getElementById("nama").value.trim();
    const unit = document.getElementById("unit").value.trim();

    if (!nama || !unit) {
        alert("Nama dan unit wajib diisi!");
        return;
    }

    try {
        await addDoc(collection(db, "peserta"), {
            nama: nama,
            unit: unit,
            status: "LULUS"
        });

        alert("Peserta berhasil ditambahkan!");

        document.getElementById("nama").value = "";
        document.getElementById("unit").value = "";

    } catch (error) {
        console.error(error);
        alert("Gagal menyimpan peserta.");
    }
};


// ============================
// FUNGSI STATUS UNIT
// ============================

async function ubahStatusUnit(unitId, statusId, tombolId) {

    const statusRef = doc(db, "pendaftaran", unitId);
    const snap = await getDoc(statusRef);

    if (!snap.exists()) {
        alert("Data " + unitId + " belum dibuat di Firebase.");
        return;
    }

    const sekarang = snap.data().dibuka;

    await updateDoc(statusRef, {
        dibuka: !sekarang
    });

    tampilkanStatus(unitId, statusId, tombolId);
}


async function tampilkanStatus(unitId, statusId, tombolId) {

    const statusRef = doc(db, "pendaftaran", unitId);
    const snap = await getDoc(statusRef);

    if (!snap.exists()) return;

    const dibuka = snap.data().dibuka;

    document.getElementById(statusId).textContent =
        dibuka ? "DIBUKA" : "DITUTUP";

    document.getElementById(tombolId).textContent =
        dibuka ? "TUTUP PENDAFTARAN" : "BUKA PENDAFTARAN";
}


// ============================
// UNIT STAFF
// ============================

document.getElementById("tombolStaff").onclick = function() {
    ubahStatusUnit(
        "unit_staff",
        "statusStaff",
        "tombolStaff"
    );
};


// ============================
// SRT
// ============================

document.getElementById("tombolSRT").onclick = function() {
    ubahStatusUnit(
        "srt",
        "statusSRT",
        "tombolSRT"
    );
};


// ============================
// PROVOST
// ============================

document.getElementById("tombolProvost").onclick = function() {
    ubahStatusUnit(
        "provost",
        "statusProvost",
        "tombolProvost"
    );
};


// ============================
// SEKAD
// ============================

document.getElementById("tombolSekad").onclick = function() {
    ubahStatusUnit(
        "sekad",
        "statusSekad",
        "tombolSekad"
    );
};


// ============================
// TAMPILKAN STATUS SAAT HALAMAN DIBUKA
// ============================

tampilkanStatus("unit_staff", "statusStaff", "tombolStaff");
tampilkanStatus("srt", "statusSRT", "tombolSRT");
tampilkanStatus("provost", "statusProvost", "tombolProvost");
tampilkanStatus("sekad", "statusSekad", "tombolSekad");

</script>
