<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hasil Kelulusan - Koarmada</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            margin: 0;
        }

        header {
            background: #0b1f33;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

            max-width: 900px;
            margin: 40px auto;

        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0b1f33;
            color: white;
        }

        .lulus {
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #0b1f33;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>

        <p>Daftar peserta yang dinyatakan lulus seleksi</p>

    <div class="container">

            <table>
                <tr>
                    <th>No. Peserta</th>
                    <th>Nama</th>
                    <th>Unit</th>

                </tr>

                <tr>
                    <td>KRM-001</td>

                </tr>

                <tr>
                    <td>KRM-002</td>

        </div>

        <a href="index.html" class="back">
