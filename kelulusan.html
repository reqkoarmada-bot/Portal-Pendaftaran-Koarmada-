<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hasil Kelulusan - Koarmada</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
            margin: 0;
        }

        header {
            background: #0b1f33;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #0b1f33;
            color: white;
        }

        .lulus {
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #0b1f33;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <header>
        <h1>HASIL KELULUSAN</h1>
        <p>Daftar peserta yang dinyatakan lulus seleksi</p>
    </header>

    <div class="container">

        <div class="table-box">

        <table>

    <thead>
        <tr>
            <th>Nama</th>
            <th>Unit</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="daftarKelulusan">
    </tbody>

        </table>
            
        </div>

        <a href="index.html" class="back">
            KEMBALI KE PORTAL
        </a>

    </div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";
import {
    getFirestore,
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyCIh890N6ZB_dxLipV8dODWS7YVitYWVew",
    authDomain: "portal-koarmada.firebaseapp.com",
    projectId: "portal-koarmada",
    storageBucket: "portal-koarmada.firebasestorage.app",
    messagingSenderId: "370381398452",
    appId: "1:370381398452:web:4fc785f94de5e9e101d2e1"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function tampilkanKelulusan() {
    const daftar = document.getElementById("daftarKelulusan");

    try {
        const snapshot = await getDocs(collection(db, "peserta"));

        daftar.innerHTML = "";

        snapshot.forEach((dokumen) => {
            const data = dokumen.data();

            daftar.innerHTML += `
                <tr>
                    <td>${data.nama}</td>
                    <td>${data.unit}</td>
                    <td class="lulus">${data.status}</td>
                </tr>
            `;
        });

    } catch (error) {
        console.error(error);
        alert("Gagal mengambil data kelulusan.");
    }
}

tampilkanKelulusan();
</script>
    
</body>
</html>
